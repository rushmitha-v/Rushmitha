<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wanderly — No Trips Yet</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter';background:#f4f9fc;color:#1b2733;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:390px;max-width:94vw;background:#fff;border-radius:28px;padding:38px 30px;text-align:center;box-shadow:0 18px 44px rgba(14,165,233,.13)}
.plane{font-size:3.8rem;display:inline-block;margin-bottom:22px;animation:fly 3.4s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(-6deg)}50%{transform:translate(14px,-12px) rotate(4deg)}}
h1{font-family:'Sora';font-size:1.5rem;letter-spacing:-.02em;line-height:1.3;margin-bottom:10px}
h1 span{background:linear-gradient(120deg,#0ea5e9,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#7d8fa1;font-size:.88rem;line-height:1.7;margin-bottom:26px}
.opts{display:flex;flex-direction:column;gap:11px;margin-bottom:26px}
.o{display:flex;align-items:center;gap:14px;background:#f7fbfd;border:1.5px solid #e3eef5;border-radius:16px;padding:14px 16px;text-align:left;cursor:pointer;transition:.2s}
.o:hover{border-color:#a8d8ee;transform:translateX(4px)}
.o i{font-style:normal;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:1.15rem;flex-shrink:0}
.o1 i{background:#e5f7ef}.o2 i{background:#ecebff}.o3 i{background:#fff3e0}
.o b{font-size:.85rem;display:block}
.o small{color:#7d8fa1;font-size:.72rem}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font-family:'Sora';font-weight:800;font-size:.92rem;color:#fff;background:linear-gradient(135deg,#0ea5e9,#f97316);cursor:pointer;box-shadow:0 14px 32px rgba(14,165,233,.35);transition:.22s}
.btn:hover{transform:translateY(-2px)}
</style></head>
<body>
<div class="card">
  <span class="plane">✈️</span>
  <h1>No trips on the board...<br><span>yet.</span></h1>
  <p>The best weekends start with one tap. What sounds like you today?</p>
  <div class="opts">
    <div class="o o1"><i>🎲</i><div><b>Surprise me</b><small>We pick a weekend under ₹5k from Bengaluru</small></div></div>
    <div class="o o2"><i>🗳️</i><div><b>Start a group vote</b><small>Invite the squad, let majority decide</small></div></div>
    <div class="o o3"><i>🔍</i><div><b>Browse escapes</b><small>Curated by vibe — nature, food, adventure</small></div></div>
  </div>
  <button class="btn">Plan my first escape →</button>
</div>
<script>
document.querySelectorAll('.o').forEach(o=>o.onclick=()=>{document.querySelectorAll('.o').forEach(x=>x.style.borderColor='#e3eef5');o.style.borderColor='#0ea5e9'});
</script>
</body></html>
