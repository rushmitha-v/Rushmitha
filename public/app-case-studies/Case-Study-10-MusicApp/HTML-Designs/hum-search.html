<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WavePlay — Hum to Search</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter';background:#0b0616;color:#f3effc;min-height:100vh;display:grid;place-items:center;padding:24px}
.app{width:390px;max-width:94vw;text-align:center}
h1{font-family:'Sora';font-size:1.42rem;letter-spacing:-.02em;line-height:1.3;margin-bottom:10px}
p.sub{color:#a89fc4;font-size:.84rem;line-height:1.65;margin-bottom:30px}
.orbwrap{position:relative;width:190px;height:190px;margin:0 auto 30px;display:grid;place-items:center}
.pulse{position:absolute;border-radius:50%;border:2px solid rgba(139,92,246,.5);animation:ripple 2.2s ease-out infinite}
.p2{animation-delay:.5s}.p3{animation-delay:1s}
@keyframes ripple{from{width:70px;height:70px;opacity:.9}to{width:190px;height:190px;opacity:0}}
.micbtn{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#22d3ee);display:grid;place-items:center;font-size:2.2rem;cursor:pointer;box-shadow:0 18px 44px rgba(139,92,246,.5);transition:.22s;position:relative;z-index:1}
.micbtn:hover{transform:scale(1.06)}
.eq{display:flex;align-items:flex-end;gap:4px;height:34px;justify-content:center;margin-bottom:26px}
.eq i{width:6px;border-radius:99px;background:linear-gradient(180deg,#a78bfa,#22d3ee);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(odd){height:12px}.eq i:nth-child(even){height:26px;animation-delay:.15s}
.eq i:nth-child(3n){animation-delay:.3s}
@keyframes eq{50%{transform:scaleY(.35)}}
.hint{font-size:.78rem;color:#cfc7e8;font-weight:600;margin-bottom:24px}
.ways{display:flex;flex-direction:column;gap:9px;text-align:left}
.w{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:12px 15px;font-size:.78rem;cursor:pointer;transition:.2s}
.w:hover{background:rgba(255,255,255,.09)}
.w i{font-style:normal;font-size:1.15rem;width:36px;height:36px;background:rgba(255,255,255,.08);border-radius:11px;display:grid;place-items:center;flex-shrink:0}
</style></head>
<body>
<div class="app">
  <h1>What's that song<br>stuck in your head?</h1>
  <p class="sub">Hum it, sing it, or play it — WavePlay finds it in seconds.</p>
  <div class="orbwrap">
    <span class="pulse"></span><span class="pulse p2"></span><span class="pulse p3"></span>
    <button class="micbtn" onclick="found()">🎤</button>
  </div>
  <div class="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="hint">Listening... hum at least 5 seconds 🎵</div>
  <div class="ways">
    <div class="w"><i>⌨️</i>Type the lyrics you remember — even one line works</div>
    <div class="w"><i>🖼️</i>Shazam a song playing around you</div>
    <div class="w"><i>🧠</i>"That Tamil song from the bike ad" — describe it</div>
  </div>
</div>
<script>
function found(){document.querySelector('.hint').innerHTML='✅ Match found: <b style="color:#22d3ee">Kadhal Cricket — Kharesma</b> · 97% confident';
setTimeout(()=>alert('🎵 Opening song page with lyrics + similar tracks'),400)}
document.querySelectorAll('.w').forEach(w=>w.onclick=()=>alert('🔎 Opening search...'));
</script>
</body></html>
