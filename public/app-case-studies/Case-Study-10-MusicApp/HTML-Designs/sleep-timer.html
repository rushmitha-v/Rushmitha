<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WavePlay — Sleep Timer</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter';background:#0b0616;color:#f3effc;min-height:100vh;display:grid;place-items:center;padding:24px}
.app{width:390px;max-width:94vw;text-align:center}
h1{font-family:'Sora';font-size:1.35rem;letter-spacing:-.02em;margin-bottom:4px}
p.sub{color:#a89fc4;font-size:.82rem;margin-bottom:26px}
.ringwrap{position:relative;width:230px;height:230px;margin:0 auto 28px;display:grid;place-items:center}
svg{position:absolute;inset:0;transform:rotate(-90deg)}
.cbg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:10}
.cfg{fill:none;stroke:url(#grad);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.time{font-family:'Sora';font-weight:800;font-size:2.9rem;background:linear-gradient(120deg,#a78bfa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.tlabel{font-size:.68rem;color:#a89fc4;text-transform:uppercase;letter-spacing:.16em;font-weight:700;margin-top:4px}
.moon{position:absolute;top:-6px;right:-2px;font-size:1.5rem;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:22px}
.o{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:15px;padding:13px 4px;font-weight:800;font-family:'Sora';font-size:.85rem;cursor:pointer;color:#cfc7e8;transition:.2s}
.o:hover{transform:translateY(-2px)}
.o.on{background:linear-gradient(135deg,#8b5cf6,#6366f1);border-color:transparent;color:#fff;box-shadow:0 10px 24px rgba(139,92,246,.4)}
.fade{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:17px;padding:15px 17px;text-align:left;display:flex;align-items:center;gap:12px}
.fade i{font-style:normal;font-size:1.3rem}
.fade b{font-size:.82rem;display:block}
.fade small{color:#a89fc4;font-size:.7rem}
.sw{margin-left:auto;width:46px;height:26px;border-radius:99px;background:linear-gradient(135deg,#8b5cf6,#6366f1);position:relative;cursor:pointer;flex-shrink:0;transition:.25s}
.sw::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:23px;transition:.25s}
</style></head>
<body>
<div class="app">
  <h1>Sleep timer 🌙</h1>
  <p class="sub">Music fades out gently — never wakes you at 3 AM</p>
  <div class="ringwrap">
    <svg viewBox="0 0 230 230"><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient></defs><circle class="cbg" cx="115" cy="115" r="104"/><circle class="cfg" id="ring" cx="115" cy="115" r="104"/></circle></svg>
    <div><div class="time" id="t">45:00</div><div class="tlabel">until fade-out</div></div>
    <span class="moon">🌙</span>
  </div>
  <div class="opts">
    <div class="o" data-m="15">15m</div><div class="o on" data-m="45">45m</div><div class="o" data-m="60">60m</div><div class="o" data-m="90">90m</div>
  </div>
  <div class="fade"><i>🎚️</i><div><b>Gradual volume fade</b><small>Last 5 minutes get softer and softer</small></div><span class="sw"></span></div>
</div>
<script>
const CIRC=2*Math.PI*104,ring=document.getElementById('ring');ring.style.strokeDasharray=CIRC;
let total=45*60,left=total;
function draw(){ring.style.strokeDashoffset=CIRC*(1-left/total);
document.getElementById('t').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}
draw();
setInterval(()=>{if(left>0){left--;draw()}},1000);
document.querySelectorAll('.o').forEach(o=>o.onclick=()=>{document.querySelectorAll('.o').forEach(x=>x.classList.remove('on'));o.classList.add('on');
total=(+o.dataset.m)*60;left=total;draw()});
document.querySelector('.sw').onclick=function(){this.classList.toggle('off');this.style.background=this.classList.contains('off')?'rgba(255,255,255,.14)':''};
</script>
</body></html>
