<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WavePlay — Mood First Run</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter';background:#0b0616;color:#f3effc;min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:float 9s ease-in-out infinite}
.o1{width:280px;height:280px;background:#8b5cf6;top:-90px;left:-80px}
.o2{width:240px;height:240px;background:#22d3ee;bottom:-70px;right:-60px;animation-delay:-4s}
@keyframes float{50%{transform:translate(24px,-20px) scale(1.08)}}
.card{position:relative;z-index:1;width:390px;max-width:94vw;text-align:center}
.logo{font-family:'Sora';font-weight:800;font-size:.95rem;letter-spacing:.28em;color:#22d3ee;margin-bottom:34px}
.icon{font-size:4rem;display:block;margin-bottom:22px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
h1{font-family:'Sora';font-size:1.65rem;letter-spacing:-.02em;line-height:1.25;margin-bottom:12px}
h1 span{background:linear-gradient(120deg,#a78bfa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#a89fc4;font-size:.9rem;line-height:1.7;margin-bottom:30px}
.moods{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:30px}
.m{padding:11px 19px;border-radius:99px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.13);font-size:.82rem;font-weight:600;cursor:pointer;transition:.22s;color:#cfc7e8}
.m:hover{transform:translateY(-2px)}
.m.on{background:linear-gradient(135deg,#8b5cf6,#6366f1);border-color:transparent;color:#fff;box-shadow:0 10px 26px rgba(139,92,246,.45)}
.btn{width:100%;border:0;border-radius:16px;padding:17px;font-family:'Sora';font-weight:800;font-size:.95rem;color:#fff;background:linear-gradient(135deg,#8b5cf6,#22d3ee);cursor:pointer;box-shadow:0 14px 32px rgba(139,92,246,.45);transition:.22s}
.btn:hover{transform:translateY(-2px)}
</style></head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="card">
  <div class="logo">WAVEPLAY</div>
  <span class="icon">🎧</span>
  <h1>How do you <span>feel right now</span>?</h1>
  <p>Music that matches your mood — not an algorithm's guess.</p>
  <div class="moods">
    <span class="m">😌 Chill</span><span class="m on">⚡ Energized</span><span class="m">🌧️ Melancholy</span><span class="m">💪 Gym mode</span><span class="m">🎯 Deep focus</span><span class="m">🎉 Party</span>
  </div>
  <button class="btn" onclick="alert('🎵 Building your energized mix...')">Start listening →</button>
</div>
<script>
document.querySelectorAll('.m').forEach(m=>m.onclick=()=>{document.querySelectorAll('.m').forEach(x=>x.classList.remove('on'));m.classList.add('on')});
</script>
</body></html>
