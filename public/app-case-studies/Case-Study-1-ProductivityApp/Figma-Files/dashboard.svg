<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640">
  <style>
    .bg { background: #F3F4F6; }
    .header { color: #111827; font-family: Inter; font-size: 24px; font-weight: bold; }
    .title { color: #3B82F6; }
    .subtitle { color: #6B7280; font-size: 14px; }
    .card { background: white; padding: 20px; border-radius: 8px; margin: 10px 0; }
    .button { background: #3B82F6; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-family: Inter; font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat { text-align: center; }
  </style>
  <rect class="bg" width="360" height="640"/>
  
  <!-- Header -->
  <text x="20" y="40" class="header">FocusMate</text>
  <text x="20" y="65" class="subtitle">👤 Alex</text>
  
  <!-- Today's Progress -->
  <rect x="20" y="90" width="320" height="40" rx="6" fill="white"/>
  <text x="30" y="110" class="subtitle">Today's Progress</text>
  <text x="30" y="130" class="title">2/5 sessions complete</text>
  
  <!-- Session Buttons -->
  <text x="30" y="160" class="subtitle">Select session length</text>
  <a x="30" y="185" href="#" class="button">START 25MIN</a>
  <a x="130" y="185" href="#" class="button">45MIN</a>
  <a x="230" y="185" href="#" class="button">90MIN</a>
  
  <!-- Recent Accomplishments -->
  <rect x="20" y="220" width="320" height="100" rx="6" fill="white"/>
  <text x="30" y="240" class="subtitle">Recent Accomplishments</text>
  <text x="30" y="260" class="completed">- Finished API refactoring (45 min)</text>
  <text x="30" y="275" class="completed">- Wrote unit tests (30 min)</text>
  
  <!-- Start Session CTA -->
  <text x="30" y="340" class="subtitle" style="color: #3B82F6;">Continue focus session</text>
  <a x="30" y="365" href="#" class="button" style="background: #10B981;">START SESSION</a>
</svg>