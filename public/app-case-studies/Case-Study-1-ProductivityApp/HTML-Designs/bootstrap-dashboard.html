<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusMate - Bootstrap 5 Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#">FocusMate</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Sessions</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Progress</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row">
      <div class="col-md-4">
        <div class="card bg-white shadow-sm h-100">
          <div class="card-header bg-primary text-white">
            <h5 class="card-title mb-0">Today's Progress</h5>
          </div>
          <div class="card-body">
            <h2 class="card-title text-primary">2/5 sessions</h2>
            <p class="card-text">45 min focused</p>
            <div class="progress mb-3" style="height: 8px;">
              <div class="progress-bar bg-primary" role="progressbar" style="width: 40%" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <button class="btn btn-primary w-100">Start Session</button>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card bg-white shadow-sm h-100">
          <div class="card-header bg-secondary text-white">
            <h5 class="card-title mb-0">Streak</h5>
          </div>
          <div class="card-body">
            <h2 class="card-title text-success">7 days</h2>
            <p class="card-text">Consistent daily focus</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card bg-white shadow-sm h-100">
          <div class="card-header bg-success text-white">
            <h5 class="card-title mb-0">Productivity</h5>
          </div>
          <div class="card-body">
            <h2 class="card-title">14.2 hrs</h2>
            <p class="card-text">This week</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
