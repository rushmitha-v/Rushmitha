<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StyleHub — Build Your Fit Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter';background:#faf7f2;color:#221a12;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:390px;max-width:94vw;background:#fff;border-radius:28px;padding:38px 30px;text-align:center;box-shadow:0 20px 50px rgba(34,26,18,.11)}
.mirror{width:120px;height:150px;margin:0 auto 24px;border-radius:60px 60px 16px 16px;border:5px solid #e3b93f;display:grid;place-items:center;font-size:3rem;background:linear-gradient(160deg,#fdf6e3,#f5ead0);position:relative;animation:shine 3s ease-in-out infinite}
@keyframes shine{50%{box-shadow:0 14px 40px rgba(201,162,39,.35)}}
h1{font-family:'Sora';font-size:1.48rem;letter-spacing:-.02em;line-height:1.28;margin-bottom:10px}
h1 span{color:#c9a227}
p{color:#8d7f70;font-size:.88rem;line-height:1.7;margin-bottom:26px}
.perks{text-align:left;margin-bottom:26px}
.pk{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:.82rem;font-weight:600}
.pk i{width:36px;height:36px;border-radius:12px;background:#fdf6e3;display:grid;place-items:center;font-style:normal;font-size:1rem;flex-shrink:0}
.btn{width:100%;border:0;border-radius:15px;padding:17px;font-family:'Sora';weight:800;font-weight:800;font-size:.92rem;color:#fff;background:#221a12;cursor:pointer;transition:.22s}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(34,26,18,.25)}
.later{margin-top:13px;color:#8d7f70;font-size:.78rem;cursor:pointer}
</style></head>
<body>
<div class="card">
  <div class="mirror">👗</div>
  <h1>Never guess your<br><span>size again</span></h1>
  <p>Answer 3 quick questions and every product on StyleHub shows exactly how it will fit you.</p>
  <div class="perks">
    <div class="pk"><i>🎯</i>Fit badges on every product — before you buy</div>
    <div class="pk"><i>🔁</i>Free size exchanges, always</div>
    <div class="pk"><i>🪞</i>Reviews from shoppers with your body type</div>
  </div>
  <button class="btn">Create my fit profile →</button>
  <span class="later">Just browsing for now</span>
</div>
</body></html>
