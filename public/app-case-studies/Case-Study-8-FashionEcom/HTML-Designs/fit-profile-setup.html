<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StyleHub — Fit Profile Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter';background:#faf7f2;color:#221a12;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:390px;max-width:94vw;background:#fff;border-radius:28px;padding:34px 30px;box-shadow:0 20px 50px rgba(34,26,18,.1)}
.dots{display:flex;gap:7px;margin-bottom:26px}
.dots i{height:6px;flex:1;border-radius:99px;background:#efe9df}
.dots i.on{background:linear-gradient(90deg,#c9a227,#e3b93f)}
.icon{font-size:3.4rem;text-align:center;display:block;margin-bottom:18px}
h1{font-family:'Sora';font-size:1.45rem;letter-spacing:-.02em;line-height:1.25;margin-bottom:10px;text-align:center}
h1 span{color:#c9a227}
p{color:#8d7f70;font-size:.88rem;line-height:1.7;margin-bottom:24px;text-align:center}
.field{margin-bottom:16px}
label{display:block;font-size:.72rem;font-weight:700;color:#8d7f70;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;gap:8px}
.sg{flex:1;padding:12px 4px;border-radius:12px;border:1.5px solid #efe9df;background:#fff;text-align:center;font-size:.82rem;font-weight:600;cursor:pointer;transition:.2s;color:#8d7f70}
.sg.on{border-color:#c9a227;background:#fdf6e3;color:#221a12;font-weight:800}
.slider{-webkit-appearance:none;width:100%;height:8px;border-radius:99px;background:linear-gradient(90deg,#c9a227 40%,#efe9df 40%);outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #c9a227;box-shadow:0 4px 12px rgba(201,162,39,.4);cursor:pointer}
.val{text-align:center;font-family:'Sora';font-weight:800;font-size:1rem;margin-top:10px}
.btn{width:100%;border:0;border-radius:15px;padding:16px;font-family:'Sora';font-weight:800;font-size:.92rem;color:#fff;background:#221a12;cursor:pointer;margin-top:14px;transition:.22s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(34,26,18,.25)}
.skip{display:block;text-align:center;margin-top:14px;color:#8d7f70;font-size:.78rem;cursor:pointer}
</style></head>
<body>
<div class="card">
  <div class="dots"><i class="on"></i><i></i><i></i></div>
  <span class="icon">📏</span>
  <h1>Build your <span>fit profile</span></h1>
  <p>Answer once — every product shows how it will fit YOU before you buy.</p>
  <div class="field"><label>Typical top size</label>
    <div class="seg"><div class="sg">XS</div><div class="sg on">S</div><div class="sg">M</div><div class="sg">L</div><div class="sg">XL</div></div></div>
  <div class="field"><label>Height</label>
    <input type="range" min="140" max="200" value="165" class="slider" id="h" oninput="upd()"><div class="val" id="hv">165 cm</div></div>
  <button class="btn" onclick="alert('✅ Fit profile saved! Products now show personalized fit badges.')">Save my profile →</button>
  <span class="skip">Skip for now</span>
</div>
<script>
function upd(){const v=document.getElementById('h').value;document.getElementById('hv').textContent=v+' cm';
document.getElementById('h').style.background='linear-gradient(90deg,#c9a227 '+((v-140)/60*100)+'%,#efe9df '+((v-140)/60*100)+'%)'}
document.querySelectorAll('.sg').forEach(s=>s.onclick=()=>{[...s.parentNode.children].forEach(x=>x.classList.remove('on'));s.classList.add('on')});
</script>
</body></html>
