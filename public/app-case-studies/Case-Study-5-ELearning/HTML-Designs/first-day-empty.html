<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LearnLoop — Day One</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter';background:#f6f5ff;color:#1d1b33;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:390px;max-width:94vw;background:#fff;border-radius:24px;padding:36px 28px;text-align:center;box-shadow:0 16px 40px rgba(29,27,51,.08)}
.seed{font-size:3.8rem;display:inline-block;margin-bottom:22px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
h1{font-family:'Sora';font-size:1.5rem;letter-spacing:-.02em;line-height:1.3;margin-bottom:10px}
h1 span{color:#5b5bd6}
p{color:#7a76a0;font-size:.9rem;line-height:1.75;margin-bottom:28px}
.steps{display:flex;flex-direction:column;gap:12px;text-align:left;margin-bottom:28px}
.st{display:flex;gap:14px;align-items:center;background:#f8f7ff;border:1px solid #efeefb;border-radius:16px;padding:14px 16px}
.st i{width:38px;height:38px;border-radius:12px;background:#ecebff;display:grid;place-items:center;font-style:normal;font-size:1rem;flex-shrink:0}
.st b{font-size:.85rem;display:block}
.st small{color:#7a76a0;font-size:.72rem}
.btn{width:100%;border:0;border-radius:14px;padding:16px;font-family:'Sora';font-weight:800;font-size:.92rem;color:#fff;cursor:pointer;background:linear-gradient(135deg,#5b5bd6,#7c7cf0);box-shadow:0 12px 26px rgba(91,91,214,.35);transition:.22s}
.btn:hover{transform:translateY(-2px)}
.no{margin-top:14px;color:#7a76a0;font-size:.8rem;cursor:pointer}
</style></head>
<body>
<div class="card">
  <span class="seed">🌱</span>
  <h1>Your learning journey<br>starts with <span>one lesson</span></h1>
  <p>5 minutes a day. That's all it takes. No pressure, just progress.</p>
  <div class="steps">
    <div class="st"><i>🎯</i><div><b>Pick your path</b><small>SQL, Python, ML, or Data Viz</small></div></div>
    <div class="st"><i>⏱</i><div><b>5-min micro-lesson</b><small>Video, audio, or text — your call</small></div></div>
    <div class="st"><i>🧠</i><div><b>Quick quiz + flashcards</b><small>Spaced repetition does the rest</small></div></div>
  </div>
  <button class="btn">Start my first lesson →</button>
  <div class="no">Browse courses first</div>
</div>
</body></html>
