<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mindful - Bootstrap 5 Mental Health</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#">Mindful</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Check-in</a></li>
          <li class="nav-item"><a class="nav-link" href="#">History</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row">
      <div class="col-12 col-lg-6">
        <div class="card bg-white shadow-sm h-100 border-primary">
          <div class="card-header bg-primary text-white">
            <h5 class="card-title mb-0">Daily Mood Check-in</h5>
          </div>
          <div class="card-body p-5">
            <h3 class="card-title mb-4">How are you feeling?</h3>
            
            <!-- Emoji Selection -->
            <div class="mb-3">
              <button class="btn btn-outline-primary emoji-btn active me-2" style="width: 48px; height: 48px; font-size: 24px;">😊</button>
              <button class="btn btn-outline-primary emoji-btn me-2" style="width: 48px; height: 48px; font-size: 24px;">😐</button>
              <button class="btn btn-outline-primary emoji-btn me-2" style="width: 48px; height: 48px; font-size: 24px;">😢</button>
              <button class="btn btn-outline-primary emoji-btn me-2" style="width: 48px; height: 48px; font-size: 24px;">😠</button>
              <button class="btn btn-outline-primary emoji-btn" style="width: 48px; height: 48px; font-size: 24px;">😴</button>
            </div>
            
            <!-- Intensity -->
            <div class="mb-3">
              <label class="form-label small d-block mb-2">Intensity</label>
              <input type="range" class="form-range-range" min="1" max="10" value="7">
              <div class="d-flex justify-content-between small">
                <span>1</span>
                <span>5</span>
                <span>10</span>
              </div>
            </div>
            
            <!-- Note -->
            <div class="mb-3">
              <label class="form-label small d-block mb-2">How are you feeling?</label>
              <textarea class="form-control" rows="2" placeholder="Optional: What's on your mind?"></textarea>
            </div>
            
            <!-- Buttons -->
            <div class="d-flex gap-2">
              <button class="btn btn-primary flex-grow">Save Mood</button>
              <button class="btn btn-outline-secondary flex-grow">Skip</button>
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="card bg-white shadow-sm h-100 border-secondary">
          <div class="card-header bg-secondary text-white">
            <h5 class="card-title mb-0">7-Day Streak</h5>
          </div>
          <div class="card-body p-5">
            <h3 class="card-title text-success mb-4">Active</h3>
            <div class="progress mb-4" style="height: 8px;">
              <div class="progress-bar bg-success" style="width: 70%" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <p class="text-muted small">Keep going! You're building a healthy habit.</p>
            <div class="d-flex justify-content-between align-items-center">
              <span>7 days</span>
              <span class="text-primary">View details</span>
            </div>
            <hr class="my-3">
            <p class="text-muted small">Suggestion: Try 2-min box breathing exercise</p>
            <button class="btn btn-link px-0 py-0 small text-primary">Learn more</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Emoji button active state
    document.querySelectorAll('.emoji-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
