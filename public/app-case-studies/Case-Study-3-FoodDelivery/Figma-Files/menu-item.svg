<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480">
  <style>
    .bg { background: white; }
    .card { background: #FFFFFF; border-radius: 16px; padding: 32px; margin: 20px; width: 280px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .restaurant-name { color: #111827; font-family: Inter; font-size: 20px; font-weight: bold; margin-bottom: 8px; }
    .cuisine { color: #F97316; font-size: 14px; margin-bottom: 16px; display: inline-block; }
    .price { color: #10B981; font-family: Inter; font-size: 18px; font-weight: bold; margin-bottom: 8px; }
    .badge { background: #EC4899; color: white; padding: 4px 8px; border-radius: 12px; font-size: 12px; margin-right: 8px; margin-bottom: 8px; display: inline-block; }
    .description { color: #6B7280; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    .cta { background: #F97316; color: white; padding: 12px; border-radius: 10px; text-decoration: none; text-align: center; font-family: Inter; font-size: 14px; margin-top: 16px; display: block; }
    .sustainable { background: #10B981; color: white; padding: 4px 8px; border-radius: 12px; font-size: 11px; margin-left: 8px; }
  </style>
  <rect class="bg" width="360" height="480"/>
  
  <!-- Restaurant Card -->
  <rect class="card" x="40" y="20" width="280" height="420"/>
  
  <!-- Restaurant Name & Badge -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" class="restaurant-name">Marco's Trattoria</text>
    <text x="120" y="0" class="sustainable">Sustainable</text>
  </g>
  
  <!-- Cuisine -->
  <text x="60" y="72" class="cuisine">Italian • 🍝 Pasta Specialist</text>
  
  <!-- Price -->
  <text x="60" y="92" class="price">$18</text>
  
  <!-- Description -->
  <text x="60" y="118" class="description">Authentic Roman-style carbonara made with pecorino romano and guanciale. Chef's signature dish since 2019.</text>
  
  <!-- Reviews -->
  <text x="60" y="150" style="color: #6B7280; font-size: 12px;">⭐ 4.7 (238 reviews)</text>
  
  <!-- Dietary Tags -->
  <g transform="translate(60, 170)">
    <text x="0" y="0" style="color: #10B981; font-size: 12px; margin-right: 6px;">🌱 Vegan</text>
    <text x="50" y="0" style="color: #F97316; font-size: 12px;">🌶️ Spicy</text>
  </g>
  
  <!-- CTA -->
  <a x="60" y="380" href="#" class="cta">ADD TO CART</a>
</svg>