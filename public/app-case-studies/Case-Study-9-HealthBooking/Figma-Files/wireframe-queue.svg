<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" font-family="Arial">
  <rect width="360" height="640" fill="#f2f7f6"/>
  <text x="20" y="40" fill="#122a27" font-size="16" font-weight="bold">🩺 MediCare+</text>
  <circle cx="288" cy="34" r="14" fill="#d8f1ee"/><text x="280" y="38" fill="#0d9488" font-size="8" font-weight="bold">ME</text>
  <circle cx="312" cy="34" r="14" fill="#fdeeda"/><text x="303" y="38" fill="#c07b1d" font-size="8" font-weight="bold">AM</text>
  <circle cx="336" cy="34" r="14" fill="#eae4f7"/><text x="328" y="38" fill="#7c5bd6" font-size="8" font-weight="bold">AP</text>
  <!-- doctor card -->
  <rect x="16" y="60" width="328" height="64" rx="0" fill="#0d9488"/>
  <rect x="16" y="60" width="328" height="64" rx="16" fill="#0d9488"/>
  <text x="32" y="88" fill="#fff" font-size="18">👩‍⚕️</text>
  <text x="64" y="84" fill="#fff" font-size="13" font-weight="bold">Dr. Meera Menon</text>
  <text x="64" y="100" fill="#c9f0eb" font-size="10">Endocrinologist · Diabetes care</text>
  <rect x="266" y="76" width="64" height="18" rx="9" fill="#fff" opacity=".22"/>
  <text x="274" y="89" fill="#fff" font-size="8" font-weight="bold">✔ VERIFIED</text>
  <!-- queue -->
  <rect x="16" y="136" width="328" height="190" rx="18" fill="#fff" stroke="#e2ebe9"/>
  <text x="180" y="164" fill="#6f8a86" font-size="9" text-anchor="middle" letter-spacing="2">LIVE QUEUE · TODAY</text>
  <text x="180" y="204" fill="#0d9488" font-size="30" font-weight="bold" text-anchor="middle">You're #4</text>
  <rect x="118" y="218" width="124" height="24" rx="12" fill="#e6f4f2"/>
  <text x="180" y="234" fill="#0d9488" font-size="11" font-weight="bold" text-anchor="middle">● ~25 min wait</text>
  <!-- track -->
  <line x1="60" y1="272" x2="300" y2="272" stroke="#e2ebe9" stroke-width="3"/>
  <circle cx="60" cy="272" r="10" fill="#0d9488"/><text x="56" y="276" fill="#fff" font-size="9">✓</text>
  <circle cx="140" cy="272" r="10" fill="#0d9488"/><text x="136" y="276" fill="#fff" font-size="9">✓</text>
  <circle cx="220" cy="272" r="11" fill="#0d9488" stroke="#0d9488" stroke-opacity=".25" stroke-width="5"/>
  <text x="216" y="276" fill="#fff" font-size="9" font-weight="bold">4</text>
  <circle cx="300" cy="272" r="10" fill="#e2ebe9"/>
  <text x="46" y="298" fill="#6f8a86" font-size="8">Checked in</text>
  <text x="128" y="298" fill="#6f8a86" font-size="8">#3 in room</text>
  <text x="206" y="298" fill="#0d9488" font-size="8" font-weight="bold">YOU 10:45</text>
  <!-- leave by -->
  <rect x="16" y="338" width="328" height="56" rx="14" fill="#fff8ec" stroke="#f3e3c3"/>
  <text x="32" y="372" fill="#c07b1d" font-size="18">🚗</text>
  <text x="64" y="362" fill="#122a27" font-size="12" font-weight="bold">Leave home by 10:35 AM</text>
  <text x="64" y="378" fill="#a08350" font-size="10">18 min drive · arrive 5 min early</text>
  <!-- prep -->
  <rect x="16" y="406" width="328" height="130" rx="16" fill="#fff" stroke="#e2ebe9"/>
  <text x="32" y="432" fill="#122a27" font-size="13" font-weight="bold">Before you see the doctor</text>
  <rect x="32" y="446" width="16" height="16" rx="5" fill="#0d9488"/>
  <text x="35" y="458" fill="#fff" font-size="9">✓</text>
  <text x="58" y="458" fill="#122a27" font-size="11">Fasting blood sugar done</text>
  <rect x="32" y="478" width="16" height="16" rx="5" fill="none" stroke="#c9dad7" stroke-width="2"/>
  <text x="58" y="490" fill="#122a27" font-size="11">Fast from 10 PM tonight</text>
  <rect x="32" y="510" width="16" height="16" rx="5" fill="none" stroke="#c9dad7" stroke-width="2"/>
  <text x="58" y="522" fill="#122a27" font-size="11">Carry medicine strips</text>
  <!-- next -->
  <rect x="16" y="548" width="328" height="60" rx="14" fill="#fff" stroke="#e2ebe9"/>
  <rect x="30" y="560" width="36" height="36" rx="11" fill="#e6f4f2"/>
  <text x="39" y="584" fill="#0d9488" font-size="15">📅</text>
  <text x="78" y="576" fill="#122a27" font-size="11" font-weight="bold">Monthly review due Sept 20</text>
  <text x="78" y="592" fill="#6f8a86" font-size="9">4-week follow-up suggested</text>
  <rect x="272" y="566" width="58" height="26" rx="9" fill="#0d9488"/>
  <text x="288" y="583" fill="#fff" font-size="10" font-weight="bold">Book</text>
</svg>
